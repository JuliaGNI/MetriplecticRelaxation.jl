name = "MetriplecticRelaxation"
uuid = "86325dbd-fdbc-4a64-9787-8114e6b727c0"
version = "0.1.0"
authors = ["Michael Kraus"]

[deps]
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
# The §4 spectral solver, which is the manuscript's own discretisation and the control the
# spline runs are checked against. Already in the manifest transitively — SimpleSplines'
# `CirculantMass` plans a real FFT for the periodic mass solve — but named here because this
# package calls it directly.
FFTW = "7a1cc6ca-52ef-59f5-83cd-3a7055c09341"
GeometricBrackets = "2a9ffa85-4e0d-473f-b05e-278d80d8d306"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
Printf = "de0858da-6303-5e67-8744-51eddeeeb8d7"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
SimpleSolvers = "36b790f5-6434-4fbe-b711-1f64a1e2f6a2"
SimpleSplines = "ac480f6c-9a94-4d53-a283-9db69f109154"
SparseArrays = "2f01184e-e22b-5df5-ae63-d93ebab69eaf"

# GeometricBrackets is not registered, so it needs an explicit source, and it needs it *here*: a
# `[sources]` table is honoured only for the active project and is never inherited from a
# dependency. SimpleSplines is registered and is resolved from General like any other dependency;
# the bound below is what selects it.
#
# This is a url rather than the relative sibling path it used to be, because a path escapes the
# repository and therefore does not exist on a CI runner: every job failed in `buildpkg` with
# "expected package ... to exist at path /home/runner/work/Packages/...", before a single test
# ran. That is the whole matrix gated on a checkout layout only this machine has.
#
# The cost is the one the path form was chosen to avoid: resolution follows `main` on the remote
# rather than the sibling working tree, so a local change to GeometricBrackets is invisible here
# until it is pushed. Develop against a sibling with `Pkg.develop(path=...)` in a local
# environment; do not put the path back in this file.
#
# `[sources]` is a Julia 1.11 feature: on 1.10 it is ignored and resolution fails outright with
# "expected package GeometricBrackets to be registered". That is why the `julia` floor below is
# 1.11 and not the tree's usual 1.10 — the `min` row of the CI matrix has to resolve.
[sources]
GeometricBrackets = {rev = "main", url = "https://github.com/JuliaGNI/GeometricBrackets.jl"}

[compat]
CairoMakie = "0.15"
FFTW = "1"
GeometricBrackets = "0.1"
LinearAlgebra = "1"
Printf = "1"
Random = "1"
SimpleSolvers = "0.13, 0.14"
SimpleSplines = "0.3"
SparseArrays = "1"
julia = "1.11"
