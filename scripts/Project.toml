# Repeated from the root `Project.toml` rather than inherited: a `[sources]` table is honoured
# only for the *active* project, and a relative path in one is resolved against that project's
# own directory. Both facts bite here — the root's `../../Packages/PoissonBrackets` would point
# at `Experiments/Packages/PoissonBrackets` when this environment is active, so every nested
# environment needs its own copy, at its own depth.
[sources]
MetriplecticRelaxation = {path = ".."}
PoissonBrackets = {path = "../../../Packages/PoissonBrackets"}
SimpleSplines = {path = "../../../Packages/SimpleSplines"}
